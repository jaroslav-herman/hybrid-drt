name: Publish eisyfit-hybrid-drt to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eisyfit-hybrid-drt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m pip install --upgrade twine && python -m twine check dist/*
      - name: Verify wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/eisyfit_hybrid_drt-*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          assert "hybdrt/__init__.py" in names
          assert any(name.startswith("hybdrt/mapping/stan_models/") and name.endswith(".stan") for name in names)
          PY
      - name: Publish to PyPI
        run: python -m twine upload dist/*
